services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 > /dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --table-name franquicias --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 ||
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name franquicias \
          --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST > /dev/null
        echo "Tabla franquicias lista"

  app:
    build:
      context: ./app
      dockerfile: deployment/Dockerfile
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_NAME: franquicias
    ports:
      - "8080:8080"
