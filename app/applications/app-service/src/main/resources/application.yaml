server:
  port: 8080

spring:
  application:
    name: nequi-franquicias
  jackson:
    deserialization:
      # Reject 1.5 for an integer field instead of silently truncating it to 1.
      accept-float-as-int: false

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-name: ${DYNAMODB_TABLE_NAME:franquicias}
